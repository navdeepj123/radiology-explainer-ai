<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — ClearScan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080d1a; --bg2:#0d1326; --card:#111827; --card2:#141e30;
  --border:#1e2d45; --blue:#4f7cff; --blue-dark:#3a63e8;
  --text:#ffffff; --muted:#8b9cbd; --light:#5a6a82;
  --err-bg:rgba(220,38,38,.1); --err-border:rgba(220,38,38,.3); --err-text:#f87171;
}
body{
  font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:2rem;-webkit-font-smoothing:antialiased;
  background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(79,124,255,.12),transparent);
}
.auth-card{
  width:100%;max-width:400px;background:var(--card);
  border:1px solid var(--border);border-radius:16px;padding:2.5rem 2.25rem;
}
.logo{
  display:block;text-align:center;font-family:'Libre Baskerville',serif;
  font-weight:700;font-size:1.35rem;color:var(--blue);text-decoration:none;
  margin-bottom:.4rem;
}
h1{
  font-family:'Libre Baskerville',serif;font-size:1.5rem;font-weight:700;
  text-align:center;margin-bottom:.4rem;
}
.subtitle{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:1.75rem}
.field{margin-bottom:1.1rem}
label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:.4rem}
input{
  width:100%;padding:11px 14px;background:var(--bg2);
  border:1px solid var(--border);border-radius:8px;color:var(--text);
  font-family:inherit;font-size:.92rem;transition:border-color .15s;
}
input:focus{outline:none;border-color:var(--blue)}
.submit-btn{
  width:100%;padding:12px;margin-top:.5rem;
  background:var(--blue);color:#fff;font-weight:600;font-size:.95rem;
  border:none;border-radius:8px;cursor:pointer;transition:background .15s;
}
.submit-btn:hover{background:var(--blue-dark)}
.error-box{
  background:var(--err-bg);border:1px solid var(--err-border);color:var(--err-text);
  padding:10px 14px;border-radius:8px;font-size:.85rem;margin-bottom:1.1rem;
}
.switch-link{text-align:center;margin-top:1.5rem;font-size:.87rem;color:var(--muted)}
.switch-link a{color:var(--blue);text-decoration:none;font-weight:500}
.switch-link a:hover{text-decoration:underline}
.guest-link{
  display:block;text-align:center;margin-top:1rem;font-size:.85rem;
  color:var(--light);text-decoration:none;
}
.guest-link:hover{color:var(--muted)}
</style>
</head>
<body>

<div class="auth-card">
  <a href="/" class="logo">ClearScan</a>
  <h1>Welcome back</h1>
  <p class="subtitle">Log in to access your saved report history</p>

  {% if error %}
  <div class="error-box">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/login">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email or '' }}" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button type="submit" class="submit-btn">Log In</button>
  </form>

  <div class="switch-link">Don't have an account? <a href="/register">Sign up</a></div>
  <a href="/analyze" class="guest-link">Continue as guest instead →</a>
</div>

</body>
</html>
